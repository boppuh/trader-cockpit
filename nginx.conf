server {
    listen 80;
    server_name cockpit.local;

    root /var/www/cockpit;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Main dashboard
    location / {
        try_files $uri $uri/ =404;
    }

    # CSS with aggressive caching (busted by regeneration)
    location ~* \.css$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # HTML — short cache so users see fresh data
    location ~* \.html$ {
        expires 30s;
        add_header Cache-Control "public, must-revalidate";
    }

    # JSON data endpoint
    location = /data.json {
        expires 30s;
        add_header Cache-Control "public, must-revalidate";
        add_header Content-Type "application/json";
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
    }
}
